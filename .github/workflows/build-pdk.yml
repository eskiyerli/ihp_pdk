# GitHub Actions workflow for building IHP PDK binaries with Nuitka
# Triggered on version tags (e.g. v0.3.0) or manually via workflow_dispatch.
#
# The build itself is delegated to build_linux.sh / build_windows.ps1 so the
# packaging logic lives in exactly one place (IHP_PDK_PYTHON pins the
# matrix interpreter, so no Poetry venv layout is needed in CI).
#
# Release artifacts are attached to a release in eskiyerli/revolutionEDA_pdks
# (tag <pdk>-<version>, e.g. ihp_pdk-v0.3.0, to avoid collisions with other
# PDKs sharing the repo) and pdks.json there is updated automatically.
# Requires a REVEDA_PAT secret with contents:write on revolutionEDA_pdks.

name: Build IHP PDK Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PDK_NAME: ihp_pdk
  REGISTRY_REPO: eskiyerli/revolutionEDA_pdks

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13', '3.14']

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.os }} py${{ matrix.python }}

    steps:
      - name: Checkout ihp_pdk
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Nuitka
        run: python -m pip install --upgrade pip nuitka
        shell: bash

      - name: Build PDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "IHP_PDK_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          IHP_PDK_SKIP_SOURCE=1 IHP_PDK_OUTPUT="$PWD/dist" ./build_linux.sh

      - name: Build PDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:IHP_PDK_PYTHON = (Get-Command python).Source
          $env:IHP_PDK_OUTPUT = "$PWD\dist"
          .\build_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PDK_NAME }}-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.zip

  source:
    runs-on: ubuntu-latest
    name: Build source archive
    steps:
      - name: Checkout ihp_pdk
        uses: actions/checkout@v4

      - name: Create source zip
        shell: bash
        run: IHP_PDK_SOURCE_ONLY=1 IHP_PDK_OUTPUT="$PWD/dist" ./build_linux.sh

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PDK_NAME }}-source
          path: dist/*.zip

  release:
    needs: [build, source]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    name: Create Release in ${{ env.REGISTRY_REPO }}
    outputs:
      release_tag: ${{ steps.rel.outputs.release_tag }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release tag and notes
        id: rel
        shell: bash
        run: |
          # Prefix the central-repo tag with the PDK name so several PDKs can
          # share the same version tag without colliding.
          echo "release_tag=${PDK_NAME}-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          cat > notes.md <<'EOF'
          ## IHP SG13G2 PDK Release

          ### Installation
          Use **Tools -> PDK -> Setup PDK** in Revolution EDA to install automatically.

          ### Packages
          - **Source**: `ihp_pdk-source.zip` — full Python source, works on all platforms
          - **Binary**: precompiled `.pyd`/`.so` modules per platform/Python version
          EOF

      - name: Create GitHub Release and upload zips
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REVEDA_PAT }}
          RELEASE_TAG: ${{ steps.rel.outputs.release_tag }}
        run: |
          set -x
          if ! gh release create "$RELEASE_TAG" \
              --repo "$REGISTRY_REPO" --target main \
              --title "IHP PDK ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              artifacts/*.zip; then
            # Release/tag already exists (re-run) — just refresh the assets.
            gh release upload "$RELEASE_TAG" --repo "$REGISTRY_REPO" \
              --clobber artifacts/*.zip
          fi

  registry:
    needs: release
    runs-on: ubuntu-latest
    name: Update registry pdks.json

    steps:
      - name: Checkout ihp_pdk (for config.json)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Clone registry repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REVEDA_PAT }}
        run: |
          # gh acts as the credential helper so the PAT never lands in URLs or
          # .git/config; the helper is persisted for the later git push.
          gh repo clone "$REGISTRY_REPO" registry -- \
            --config credential.helper='!gh auth git-credential'
          git -C registry config user.name "github-actions[bot]"
          git -C registry config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update pdks.json for ${{ env.PDK_NAME }}
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          python - <<'PYEOF'
          import glob
          import json
          import os
          import pathlib
          import re

          pdk = os.environ["PDK_NAME"]
          tag = os.environ["RELEASE_TAG"]
          base = f"https://github.com/eskiyerli/revolutionEDA_pdks/releases/download/{tag}"

          with open("config.json", encoding="utf-8") as f:
              version = json.load(f).get(
                  "pdk_version", os.environ["GITHUB_REF_NAME"].lstrip("v")
              )

          binary_urls = {}
          per_platform = {}
          source_url = None
          for path in glob.glob("artifacts/*.zip"):
              name = pathlib.Path(path).name
              m = re.fullmatch(rf"{re.escape(pdk)}-(.+)-py(\d+)\.(\d+)\.zip", name)
              if m:
                  plat, major, minor = m.groups()
                  binary_urls[f"{plat}-py{major}{minor}"] = f"{base}/{name}"
                  per_platform.setdefault(plat, []).append((int(major), int(minor), name))
              elif name == f"{pdk}-source.zip":
                  source_url = f"{base}/{name}"
          # platform-level fallback key points at the newest Python build
          for plat, builds in per_platform.items():
              newest = max(builds)
              binary_urls[plat] = f"{base}/{newest[2]}"

          path = pathlib.Path("registry/pdks.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entries = data["pdks"] if isinstance(data, dict) else data
          for entry in entries:
              if entry.get("name") != pdk:
                  continue
              entry["pdk_version"] = version
              if entry.get("type") == "source" and source_url:
                  entry["url"] = source_url
              elif entry.get("type") == "binary" and binary_urls:
                  entry["binary_urls"] = binary_urls
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PYEOF

      - name: Commit and push registry update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REVEDA_PAT }}
        run: |
          if git -C registry diff --quiet; then
            echo "pdks.json unchanged — nothing to commit"
          else
            git -C registry add pdks.json
            git -C registry commit -m "Update ${PDK_NAME} registry entry for ${PDK_NAME}-${GITHUB_REF_NAME}"
            git -C registry push
          fi
